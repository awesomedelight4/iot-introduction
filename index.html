<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internet of Things: Systems, Builds and Security</title>
<style>
:root{--ink:#1f1f1f;--muted:#5d5d5d;--line:#dcdcd8;--panel:#f6f6f4;--accent:#1d4e89;--mark:#fff0a6;--ok:#1e7a3c;--bad:#b3261e;--okbg:#e8f4ec;--badbg:#fbeaea}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#fff;line-height:1.6;font-size:16px}
a{color:var(--accent)}
header.top{border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;background:#fff;z-index:5}
header.top h1{font-size:18px;margin:0;font-weight:600}
header.top .menu{display:none;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
.wrap{display:flex;min-height:calc(100vh - 56px)}
nav.side{width:260px;flex:none;border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;background:#fff}
nav.side a.wk{display:block;padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px}
nav.side a.wk span{display:block;font-weight:400;color:var(--muted);font-size:13px}
nav.side a.wk.on{background:var(--panel);border-left:3px solid var(--accent)}
nav.side .sub{margin:2px 0 8px 14px}
nav.side .sub a{display:block;font-size:13px;color:var(--muted);text-decoration:none;padding:2px 8px}
nav.side .sub a:hover{color:var(--accent)}
nav.side .prog{font-size:12px;color:var(--muted);padding:10px;border-top:1px solid var(--line);margin-top:10px}
main{flex:1;min-width:0;padding:24px 32px 80px;max-width:980px}
h2.wtitle{font-size:28px;margin:0 0 4px}
.wsub{color:var(--muted);margin:0 0 18px}
section.blk{border-top:1px solid var(--line);padding:22px 0 6px;scroll-margin-top:70px}
section.blk>h3{font-size:21px;margin:0 0 10px}
section.blk h4{font-size:17px;margin:18px 0 6px}
.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 7px;margin-bottom:6px;text-transform:uppercase}
mark{background:var(--mark);padding:0 2px;border-radius:2px;color:inherit}
.outcomes{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 18px}
.outcomes ul{margin:6px 0}
dl.defs{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
dl.defs dt,dl.defs dd{margin:0;padding:9px 12px;border-bottom:1px solid var(--line)}
dl.defs dt{font-weight:600;background:var(--panel)}
dl.defs dt:nth-last-of-type(1),dl.defs dd:last-child{border-bottom:none}
figure{margin:14px 0;text-align:center}
figure img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px}
figcaption{font-size:14px;color:var(--muted);margin-top:4px}
table.t{border-collapse:collapse;width:100%;margin:10px 0;font-size:15px}
table.t th,table.t td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--panel)}
pre.code{background:#fafaf8;border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto;font:14px/1.5 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;margin:8px 0}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;background:var(--panel);padding:0 4px;border-radius:3px}
pre code{background:none;padding:0}
.copy{float:right;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:5px;padding:2px 8px;cursor:pointer}
.step{border:1px solid var(--line);border-radius:8px;padding:10px 16px;margin:12px 0}
.step>h4{margin-top:4px}
.note{border-left:3px solid var(--accent);background:#f3f6fa;padding:8px 12px;margin:10px 0;border-radius:0 6px 6px 0}
.warn{border-left:3px solid var(--bad);background:var(--badbg);padding:8px 12px;margin:10px 0;border-radius:0 6px 6px 0}
.act{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fff}
.act .instr{color:var(--muted);margin:0 0 10px}
.btns{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
button.b{font:inherit;font-size:14px;border:1px solid #bbb;background:#fff;border-radius:6px;padding:6px 14px;cursor:pointer}
button.b.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
button.b:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fb{margin-top:10px;font-size:15px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px;padding:8px;background:var(--panel);border-radius:8px}
.chip{border:1px solid #bbb;background:#fff;border-radius:14px;padding:2px 10px;font-size:14px;cursor:pointer}
.chip.used{opacity:.35}
.filltext{line-height:2.2}
.filltext input{font:inherit;font-size:15px;width:9em;border:none;border-bottom:2px solid #999;padding:0 4px;background:#fffef5}
.filltext input.ok{border-color:var(--ok);background:var(--okbg)} .filltext input.bad{border-color:var(--bad);background:var(--badbg)}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.mrow select{font:inherit;font-size:14px;width:100%;padding:5px;border:1px solid #bbb;border-radius:6px;background:#fff}
.mrow select.ok{border-color:var(--ok);background:var(--okbg)} .mrow select.bad{border-color:var(--bad);background:var(--badbg)}
ol.ord{list-style:none;padding:0;margin:0}
ol.ord li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:5px 0;background:#fff}
ol.ord li .n{width:22px;color:var(--muted);font-size:13px}
ol.ord li .tx{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;white-space:pre-wrap}
ol.ord.plain li .tx{font-family:inherit;font-size:15px}
ol.ord li button{border:1px solid #bbb;background:#fff;border-radius:4px;cursor:pointer;width:30px;height:28px;font-size:14px}
ol.ord li.ok{border-color:var(--ok);background:var(--okbg)} ol.ord li.bad{border-color:var(--bad);background:var(--badbg)}
.bugcode{border:1px solid var(--line);border-radius:8px;overflow:hidden;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace}
.bugcode div.l{display:flex;cursor:pointer;white-space:pre}
.bugcode div.l:hover{background:#f3f3f0}
.bugcode .ln{width:36px;text-align:right;padding-right:8px;color:#999;background:var(--panel);user-select:none;flex:none}
.bugcode .c{padding-left:8px;overflow-x:auto}
.bugcode div.l.sel{background:#fff3c4}
.bugcode div.l.hit{background:var(--okbg)} .bugcode div.l.miss{background:var(--badbg)} .bugcode div.l.missed{outline:2px dashed var(--bad);outline-offset:-2px}
.explain{margin-top:10px;padding:10px 12px;background:var(--panel);border-radius:8px;font-size:15px}
.mcq label{display:block;padding:6px 10px;border:1px solid var(--line);border-radius:6px;margin:5px 0;cursor:pointer}
.mcq label.ok{border-color:var(--ok);background:var(--okbg)} .mcq label.bad{border-color:var(--bad);background:var(--badbg)}
.mcq .q{font-weight:600;margin:12px 0 4px}
.widget{border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.widget select,.widget input{font:inherit;font-size:15px;padding:5px;border:1px solid #bbb;border-radius:6px}
.res-row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.res-row label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.out{font-size:20px;font-weight:600;margin-top:10px}
.srcs{font-size:14px}
.srcs li{margin:3px 0}
.pager{display:flex;justify-content:space-between;margin-top:30px;border-top:1px solid var(--line);padding-top:16px}
.done-tick{font-size:12px;color:var(--ok);margin-left:6px}
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:6px 0 12px}
.rung{border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:12px;color:#999;background:#fff}
.rung b{display:block;font-weight:600;font-size:12px}
.rung.has{color:var(--ink);background:var(--panel);border-color:#bdbdb6}
.rung span{font-size:11px;color:var(--muted)}
.tag .bl{color:var(--accent)}
.wprog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:14px}
.wprog .bar{flex:0 0 200px;height:8px;background:var(--panel);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.wprog .bar i{display:block;height:100%;background:var(--ok)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:860px){
  nav.side{position:fixed;left:-280px;top:56px;z-index:9;transition:left .2s;box-shadow:2px 0 8px rgba(0,0,0,.08)}
  nav.side.open{left:0}
  header.top .menu{display:inline-block}
  main{padding:18px 16px 60px}
  dl.defs{grid-template-columns:1fr} dl.defs dt{border-bottom:none}
  .mrow,.grid2{grid-template-columns:1fr} .ladder{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<header class="top"><button class="menu" id="menuBtn" aria-label="Open week menu">Weeks</button><h1>Internet of Things: Systems, Builds and Security</h1></header>
<div class="wrap">
<nav class="side" id="side" aria-label="Course weeks"></nav>
<main id="main"><p>Loading course…</p></main>
</div>
<script src="w1.js"></script>
<script src="w2.js"></script>
<script src="w3.js"></script>
<script src="w4.js"></script>
<script src="w5.js"></script>
<script src="w6.js"></script>
<script src="app.js"></script>
</body>
</html>
